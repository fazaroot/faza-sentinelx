name: Deploy to Vercel — Sentinel Edge WAF

on:
  push:
    branches: [main]
    paths:
      - "vercel-waf/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "vercel-waf/**"
  workflow_dispatch: {}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test:
    name: Self-test (Edge WAF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vercel-waf
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: vercel-waf/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run test suites
        run: npm test

  deploy-prod:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./vercel-waf
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: vercel-waf/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Deploy to Vercel (prod)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          vercel-scope: ${{ secrets.VERCEL_SCOPE }}

  preview:
    name: Preview on PR / non-main
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./vercel-waf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: vercel-waf/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Deploy preview to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--cwd vercel-waf"
